<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="900" fill="#0f0f0f"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1400" height="56" fill="#161616" stroke="#2a2a2a"/>
  <text x="32" y="35" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="600" fill="#e5e5e5">📖 GamePulse API Docs</text>
  
  <text x="32" y="100" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="18" font-weight="600" fill="#e5e5e5">REST API Endpoints</text>
  
  <!-- Endpoints -->
  <rect x="32" y="140" width="1336" height="60" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="52" y="165" font-family="monospace" font-size="12" fill="#22c55e">GET /api/servers</text>
  <text x="52" y="183" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" fill="#737373">Get all servers with current status</text>
  
  <rect x="32" y="215" width="1336" height="60" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="52" y="240" font-family="monospace" font-size="12" fill="#22c55e">GET /api/stats</text>
  <text x="52" y="258" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" fill="#737373">Get dashboard statistics</text>
  
  <rect x="32" y="290" width="1336" height="60" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="52" y="315" font-family="monospace" font-size="12" fill="#22c55e">GET /api/history/:id</text>
  <text x="52" y="333" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" fill="#737373">Get uptime history for a server</text>
  
  <rect x="32" y="365" width="1336" height="60" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="52" y="390" font-family="monospace" font-size="12" fill="#22c55e">GET /api/badge/:id.svg</text>
  <text x="52" y="408" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" fill="#737373">Get status badge SVG</text>
  
  <rect x="32" y="440" width="1336" height="60" rx="6" fill="#1f1f1f" stroke="#2a2a2a"/>
  <text x="52" y="465" font-family="monospace" font-size="12" fill="#3b82f6">POST /api/rcon/:id</text>
  <text x="52" y="483" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="11" fill="#737373">Send RCON command (requires auth)</text>
</svg>
