<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePulse - Game Server Monitor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i>
                    <h1>GamePulse</h1>
                </div>
                <button class="refresh-btn" id="refreshBtn">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
            </div>
        </header>

        <main class="main">
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon online">
                        <i class="fas fa-server"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="onlineCount">0</div>
                        <div class="stat-label">Online</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon players">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalPlayers">0</div>
                        <div class="stat-label">Total Players</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon total">
                        <i class="fas fa-network-wired"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">Total Servers</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon uptime">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="uptime">0s</div>
                        <div class="stat-label">Uptime</div>
                    </div>
                </div>
            </section>

            <section class="servers-section">
                <div class="section-header">
                    <h2>Servers</h2>
                    <span class="live-indicator">
                        <span class="pulse"></span>
                        Live
                    </span>
                </div>
                <div class="servers-grid" id="serversGrid">
                    <!-- Servers will be populated by JS -->
                </div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <i class="fas fa-server"></i>
                    <h3>No servers configured</h3>
                    <p>Add servers to <code>config/servers.json</code> and refresh</p>
                </div>
            </section>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
