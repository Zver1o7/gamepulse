<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePulse - Game Server Monitor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i>
                    <h1>GamePulse</h1>
                </div>
                <div class="header-actions">
                    <button class="lang-toggle" id="langToggle" title="Switch language">
                        <span id="langLabel">EN</span>
                    </button>
                    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="refresh-btn" id="refreshBtn">
                        <i class="fas fa-sync-alt"></i>
                        <span data-i18n="refresh">Refresh</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon online">
                        <i class="fas fa-server"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="onlineCount">0</div>
                        <div class="stat-label" data-i18n="online">Online</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon players">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalPlayers">0</div>
                        <div class="stat-label" data-i18n="totalPlayers">Total Players</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon total">
                        <i class="fas fa-network-wired"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label" data-i18n="totalServers">Total Servers</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon uptime">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="uptime">0s</div>
                        <div class="stat-label" data-i18n="uptime">Uptime</div>
                    </div>
                </div>
            </section>

            <section class="controls-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Search servers by name or game...">
                </div>
                <div class="filter-group">
                    <button class="filter-btn active" data-filter="all" data-i18n="all">All</button>
                    <button class="filter-btn" data-filter="online" data-i18n="online">Online</button>
                    <button class="filter-btn" data-filter="offline" data-i18n="offline">Offline</button>
                </div>
            </section>

            <section class="servers-section">
                <div class="section-header">
                    <h2 data-i18n="servers">Servers</h2>
                    <span class="live-indicator">
                        <span class="pulse"></span>
                        <span data-i18n="live">Live</span>
                    </span>
                </div>
                <div class="servers-grid" id="serversGrid">
                    <!-- Servers will be populated by JS -->
                </div>
                <div class="empty-state" id="emptyState" style="display: none;">
                    <i class="fas fa-server"></i>
                    <h3 data-i18n="noServers">No servers configured</h3>
                    <p data-i18n="noServersDesc">Add servers to <code>config/servers.json</code> and refresh</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p><span data-i18n="madeWith">Made with</span> <i class="fas fa-heart"></i> <span data-i18n="forCommunity">for the game server community</span> • By <a href="https://github.com/Zver1o7" target="_blank">Zver1o7</a> • <a href="https://github.com/Zver1o7/gamepulse" target="_blank">GitHub</a></p>
            </div>
        </footer>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
